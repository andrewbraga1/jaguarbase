name: Fast CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test (Unit & Chaos)
    runs-on: ubuntu-latest
    
    # Apenas o Redis para o Cofre Zero-Trust não crashar o servidor
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc

      - name: Go Mod Tidy Check
        run: go mod tidy && git diff --exit-code

      - name: Run Tests (Unit & VSS)
        run: CGO_ENABLED=1 go test -v -race ./...

      - name: Chaos Test 02 (Context Cancellation)
        run: CGO_ENABLED=1 go run cmd/chaos/phantom_agent/main.go
      
      - name: Build Binary
        run: CGO_ENABLED=1 go build -o jaguarbase ./cmd/jaguarbase/main.go
      
      - name: Chaos Test 03 (Load Shedding)
        env:
          JAGUARBASE_HMAC_SECRET: "ci_dummy_secret_key_123"
          REDIS_URL: "redis://localhost:6379"
        run: |
          cat <<EOF > jaguardb.yaml
          version: "1.0"
          security:
            mcp_in_flight_limit: 2
          sources:
            - table: "chaos_target"
              schema:
                - column: "id"
                  type: "string"
                  governance: "none"
          EOF

          # Força o IPv4 no Chaos Agent para não dar erro de rede no Github
          sed -i 's/localhost/127.0.0.1/g' cmd/chaos/runaway_loop/main.go

          ./jaguarbase &
          SERVER_PID=$!
          
          sleep 2
          go run cmd/chaos/runaway_loop/main.go
          kill $SERVER_PID

      - name: Build Docker Image
        run: docker build -t andrewbraga1/jaguarbase:latest .