name: JaguarBase CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install CGO Dependencies (DuckDB requirement)
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc

      - name: Go Mod Tidy Check
        run: go mod tidy && git diff --exit-code

      - name: Run Tests with Race Detector
        run: CGO_ENABLED=1 go test -v -race ./...

      - name: Chaos Test 02 (Context Cancellation / Phantom Agent)
        run: CGO_ENABLED=1 go run cmd/chaos/phantom_agent/main.go
      
      - name: Build Binary
        run: CGO_ENABLED=1 go build -o jaguarbase ./cmd/jaguarbase/main.go
      
      - name: Chaos Test 03 (Load Shedding / Runaway Loop)
        run: |
          # We inject a dummy HMAC secret so the Zero-Trust engine boots up
          JAGUARBASE_HMAC_SECRET="ci_dummy_secret_key_123" ./jaguarbase &
          SERVER_PID=$!
          
          sleep 2
          
          go run cmd/chaos/runaway_loop/main.go
          
          kill $SERVER_PID

      - name: Build Docker Image (Edge AI Container)
        run: docker build -t andrewbraga1/jaguarbase:latest .