name: JaguarBase CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install CGO Dependencies (DuckDB requirement)
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc

      - name: Go Mod Tidy Check
        run: go mod tidy && git diff --exit-code

      - name: Run Tests with Race Detector
        # CGO_ENABLED=1 is required for go-duckdb compilation
        run: CGO_ENABLED=1 go test -v -race ./...

      - name: Chaos Test 02 (Context Cancellation / Phantom Agent)
        run: CGO_ENABLED=1 go run cmd/chaos/phantom_agent/main.go
      
      - name: Build Binary
        run: CGO_ENABLED=1 go build -o jaguarbase ./cmd/jaguarbase/main.go
      
      - name: Chaos Test 03 (Load Shedding / Runaway Loop)
        run: |
          # 1. Start the pre-compiled binary in the background (Starts instantly)
          ./jaguarbase &
          SERVER_PID=$!
          
          # 2. Give it 2 seconds to bind the HTTP port
          sleep 2
          
          # 3. Fire the Chaos script
          go run cmd/chaos/runaway_loop/main.go
          
          # 4. Gracefully kill the server after the test
          kill $SERVER_PID