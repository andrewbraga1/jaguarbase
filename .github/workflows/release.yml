name: JaguarBase Automated Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Release Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install CGO Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential gcc

      - name: Build Optimized Linux Binary
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o jaguarbase-linux-amd64 ./cmd/jaguarbase/main.go
          
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: jaguarbase-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
